version: 2
# Version updates for what this repository pins. Nothing here is auto-merged: these
# workflows run in every repository's CI, so each bump is reviewed.
# Commits are `deps: ...`, which release-please lists under "Dependencies".
# Every ecosystem has a cooldown: a release must be 7 days old before it is offered
# (14 for the commit hooks), so one pulled for being malicious never reaches a PR
# (zizmor's dependabot-cooldown audit).
# Provisional: those-who-run/paddock#22 chooses between Dependabot and Renovate for
# the organisation, and this file follows that choice.
updates:
  # The SHA-pinned actions in .github/workflows. Majors get their own PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      actions:
        update-types: [minor, patch]
  # The hooks pinned by SHA in .pre-commit-config.yaml (the tag in the `frozen:`
  # comment, which Dependabot keeps). They run code on the maintainer's machine at
  # every commit, hence the longer cooldown, as in v1.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
  # pre-commit and its dependencies, which CI installs, hash-checked, from
  # .github/requirements-ci.txt.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
