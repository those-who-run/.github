name: Image

# Builds a repository's container image and smoke-tests it; with `push: true`, from a
# vX.Y.Z tag, also publishes it as ghcr.io/those-who-run/twr-<repo>:X.Y.Z with
# BuildKit's SLSA provenance and SPDX SBOM, and attests both. Callers, inputs and how
# to verify an image: .github/workflows/README.md.
#
# Job names are stable, because rulesets require checks by name
# (`<caller job> / <reusable job>`); renaming one leaves every caller's `main` waiting
# for a check that never reports:
#   build    every run: checks the inputs (and, with `push`, the tag), builds the
#            image for one platform, smoke-tests it, pushes nothing. With the caller
#            job named `image`, the PR check is `image / build`.
#   publish  only with `push`, after build: in the caller's `release` environment,
#            builds again, smoke-tests, pushes and attests. The only job with
#            packages, id-token and attestations write.
on:
  workflow_call:
    inputs:
      image:
        description: The image's name under ghcr.io/<owner>/. Empty means twr-<repository>.
        type: string
        default: ""
      context:
        description: The build context, relative to the repository root.
        type: string
        default: "."
      dockerfile:
        description: The Dockerfile, relative to the repository root. Empty means <context>/Dockerfile.
        type: string
        default: ""
      platforms:
        description: The platform to build for. One only, for now.
        type: string
        default: linux/amd64
      smoke:
        description: >-
          A bash command run from the repository root against the built image, named
          in $IMAGE; a non-zero exit fails the job. For example:
          docker run --rm "$IMAGE" --version
        type: string
        required: true
      push:
        description: Publish the image. Only from a vX.Y.Z tag; any other ref fails before building.
        type: boolean
        default: false
    outputs:
      digest:
        description: The published image's digest (sha256:…), empty without `push`.
        value: ${{ jobs.publish.outputs.digest }}

# Nothing by default; each job asks for what it uses. The caller's job grants the
# ceiling, and these narrow it, so only publish ever holds a write token.
permissions: {}

# Actions are pinned by commit SHA (the tag in the comment); Dependabot bumps them.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.inputs.outputs.name }}
      version: ${{ steps.inputs.outputs.version }}
    steps:
      # First, so a publish from a branch or a PR fails before anything is built.
      # Everything a caller or the event controls comes in through env:, never
      # expanded into the script.
      - name: Check the inputs
        id: inputs
        env:
          PUSH: ${{ inputs.push }}
          IMAGE_INPUT: ${{ inputs.image }}
          PLATFORMS: ${{ inputs.platforms }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image=${IMAGE_INPUT:-twr-${GITHUB_REPOSITORY#*/}}
          if ! [[ $image =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::image name '$image' is not a lower-case OCI repository name"
            exit 1
          fi
          # A loaded image has one platform, and the SBOM attested is that one's.
          if ! [[ $PLATFORMS =~ ^[a-z0-9]+/[a-z0-9]+(/[a-z0-9]+)?$ ]]; then
            echo "::error::platforms must name exactly one platform, such as linux/amd64, not '$PLATFORMS'"
            exit 1
          fi
          version=""
          if [ "$PUSH" = true ]; then
            if [ "$REF_TYPE" != tag ] || [ "$REF" != "refs/tags/$REF_NAME" ]; then
              echo "::error::push: true runs only from a vX.Y.Z tag, not $REF"
              exit 1
            fi
            if ! [[ $REF_NAME =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::tag $REF_NAME is not vX.Y.Z (or vX.Y.Z-pre)"
              exit 1
            fi
            version=${BASH_REMATCH[1]}
          fi
          {
            echo "name=ghcr.io/${OWNER,,}/$image"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Actions cache speeds up PR builds; a run that leads to a publish reads
      # none, so nothing another run wrote reaches a published image.
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          load: true
          tags: ${{ steps.inputs.outputs.name }}:smoke
          cache-from: ${{ !inputs.push && 'type=gha' || '' }}
          cache-to: ${{ !inputs.push && 'type=gha,mode=max' || '' }}
      # The caller's command, from env:, so its text is never expanded into a script.
      - name: Smoke test
        env:
          IMAGE: ${{ steps.inputs.outputs.name }}:smoke
          SMOKE: ${{ inputs.smoke }}
        run: bash -euo pipefail -c "$SMOKE"

  publish:
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    # The maintainer approves each publish there (a required reviewer), and the
    # environment's deployment rules keep it to tags.
    environment: release
    permissions:
      contents: read
      packages: write # the push to ghcr.io with this job's token: no registry secret
      id-token: write # the OIDC token Sigstore signs the attestations with
      attestations: write # stores the attestations in the caller's repository
    # One publish per ref at a time, never cancelled half-pushed.
    concurrency:
      group: image-publish-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      NAME: ${{ needs.build.outputs.name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built and smoke-tested again here, before the registry login, so what is
      # pushed below comes from the layers this job tested, and the smoke command
      # never runs with registry credentials on disk. No Actions cache.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          load: true
          tags: ${{ env.NAME }}:smoke
      - name: Smoke test
        env:
          IMAGE: ${{ env.NAME }}:smoke
          SMOKE: ${{ inputs.smoke }}
        run: bash -euo pipefail -c "$SMOKE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # BuildKit attaches its SLSA provenance and an SPDX SBOM to the image index.
      # The source label and annotation link the package to the calling repository
      # on GitHub (the label on the image, the annotation on the index that the
      # attestations make). No `latest`: a deployment pins the version it runs.
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.NAME }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ env.VERSION }}
      # The SBOM BuildKit attached, read back from the pushed image, so the SBOM
      # attestation describes exactly what was pushed.
      - name: The SBOM, from the pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$NAME@$DIGEST" \
            --format '{{ json .SBOM.SPDX }}' > "$RUNNER_TEMP/sbom.spdx.json"
          jq -e '.spdxVersion' "$RUNNER_TEMP/sbom.spdx.json" # fails on an image without one (null)
      # Signed attestations, by digest, stored in the caller's repository and pushed
      # to the registry next to the image. A reusable workflow signs as itself, so
      # they name this file as the signer workflow (README, Verifying an image). No
      # storage record: it would need artifact-metadata: write, for an organisation
      # view nothing here uses.
      - name: Attest the provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Published \`$NAME:$VERSION\` (\`$DIGEST\`). Verify it with:"
            echo
            echo '```sh'
            echo "gh attestation verify oci://$NAME:$VERSION \\"
            echo "  --repo $GITHUB_REPOSITORY --source-ref $GITHUB_REF \\"
            echo "  --signer-workflow those-who-run/.github/.github/workflows/image.yml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
