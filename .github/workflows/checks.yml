name: Checks

# The language-neutral checks every repository runs on a PR, whatever its language:
# dependency review, the repository's commit hooks on every file, gitleaks over the
# PR's commits and the PR title as a Conventional Commit. A repository's language
# checks come from their own reusable workflow, called beside this one as a separate
# required check; that workflow also checks the reason a PR that weakens tests gives.
#
# Call it from a job of its own, pinned by the release tag's commit SHA:
#
#   jobs:
#     checks:
#       permissions:
#         contents: read
#       uses: those-who-run/.github/.github/workflows/checks.yml@<sha> # vX.Y.Z
#
# Job name: `checks`. Rulesets require it by name as `<caller job> / checks`, so the
# caller above reports `checks / checks`. The name stays: renaming it leaves every
# caller's `main` waiting for a check that never reports. The job has no `if:`, and
# the caller's job should have no `if:` or `needs:` either, so the required check
# always runs (tests/test_checks_workflow.py).
#
# pre-commit itself (hash-pinned in .github/requirements-ci.txt) and the gitleaks
# hook for the PR's commits (in .pre-commit-config.yaml) come from this repository
# at the commit the caller pinned, so every caller scans with the same, reviewed
# versions and Renovate bumps them in one place. The commit hooks on every file
# are the caller's own, from its .pre-commit-config.yaml.
#
# Changing an input (adding a required one, removing or renaming one, or changing
# a default's meaning) is a breaking change: see AGENTS.md.
on:
  workflow_call:
    inputs:
      python-version:
        description: The Python that runs pre-commit and any local Python hooks.
        type: string
        default: "3.13"
      go-version-file:
        description: >-
          A go.mod or .go-version to install Go from, for local hooks that run Go
          tools. Empty: no Go.
        type: string
        default: ""
      setup:
        description: >-
          Shell commands run before the commit hooks, to install what the
          repository's local hooks need (for example `make tools`). Empty: nothing.
        type: string
        default: ""
      commit-types:
        description: >-
          The Conventional Commit types a PR title may use, separated by spaces.
          The default is release-please's types, as in the commit-msg hook.
        type: string
        default: feat fix perf revert deps docs refactor test build ci chore style
      dependency-review:
        description: >-
          Review the dependencies a PR adds or changes. It needs the repository's
          dependency graph, which public repositories have by default.
        type: boolean
        default: true

# Nothing by default; the job asks for what it uses.
permissions: {}

# Actions are pinned by commit SHA (the tag in the comment); Renovate bumps them.
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the PR's commits

      # A squash merge takes the PR title as the commit subject, which no local hook
      # sees. The title and the types come in through env:, never expanded into the
      # script; each type must be a plain word, so it is safe inside the pattern.
      - name: PR title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_TYPES: ${{ inputs.commit-types }}
        run: |
          types=""
          for t in $COMMIT_TYPES; do
            if ! [[ $t =~ ^[a-z]+$ ]]; then
              echo "::error::commit-types: '$t' is not a lower-case word"
              exit 1
            fi
            types="${types:+$types|}$t"
          done
          if [ -z "$types" ]; then
            echo "::error::commit-types is empty"
            exit 1
          fi
          pattern="^($types)(\([^()]+\))?!?: [^[:space:]]"
          if ! [[ $PR_TITLE =~ $pattern ]]; then
            echo "::error::The PR title is not a Conventional Commit: '$PR_TITLE'. It needs '<type>[(scope)][!]: <description>', with a type from: $COMMIT_TYPES"
            exit 1
          fi
          echo "PR title: '$PR_TITLE'"

      # What the PR changes in the dependency manifests and lock files, and in the
      # actions its workflows use: fails on a known vulnerability of moderate
      # severity or above, or a licence outside the list. Dev packages count too:
      # they run in CI with a token. The list is v1's plus GPL-3.0, the project's own
      # licence. A few Go tool dependencies carry a notice outside it (CC-BY-3.0 in
      # structtag, OFL-1.1 in chroma, Go's PATENTS grant in golang.org/x), and so
      # does wcwidth (HPND-Markus-Kuhn, for the C code it derives from), which
      # copier pulls in through prompt_toolkit for chassis's template check, and
      # go-digest (CC-BY-SA-4.0 on its docs, beside Apache-2.0), which buf brings
      # into contracts' tools; the
      # action can only exempt a package from the licence check by its exact name,
      # so those are listed one by one and the notices stay off the global list.
      # The vulnerability check still covers them.
      - name: Dependency review
        if: github.event_name == 'pull_request' && inputs.dependency-review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0,
            GPL-3.0, GPL-3.0-only, GPL-3.0-or-later, ISC, LGPL-3.0-only,
            LGPL-3.0-or-later, MIT, MIT-0, MPL-2.0, PSF-2.0, Python-2.0, Unlicense,
            Zlib
          allow-dependencies-licenses: >-
            pkg:golang/github.com/fatih/structtag,
            pkg:golang/github.com/alfatraining/structtag,
            pkg:golang/github.com/alecthomas/chroma,
            pkg:golang/github.com/alecthomas/chroma/v2,
            pkg:golang/golang.org/x/crypto, pkg:golang/golang.org/x/exp,
            pkg:golang/golang.org/x/mod, pkg:golang/golang.org/x/net,
            pkg:golang/golang.org/x/sync, pkg:golang/golang.org/x/sys,
            pkg:golang/golang.org/x/telemetry, pkg:golang/golang.org/x/term,
            pkg:golang/golang.org/x/text, pkg:golang/golang.org/x/tools,
            pkg:golang/golang.org/x/vuln, pkg:pypi/wcwidth,
            pkg:golang/github.com/opencontainers/go-digest
          show-openssf-scorecard: true
          comment-summary-in-pr: never

      # This workflow's own files at the commit the caller pinned: pre-commit's
      # hash-pinned requirements and the config with the gitleaks-pr hook. The job
      # context names that commit (job.workflow_repository, job.workflow_sha); it
      # comes in whole through toJSON because actionlint v1.7.12 does not know those
      # two properties yet.
      - name: Fetch the checks' tooling
        id: tooling
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          WORKFLOW_REPOSITORY=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          WORKFLOW_SHA=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if ! [[ $WORKFLOW_REPOSITORY =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && $WORKFLOW_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The job context does not name this workflow's repository and commit."
            exit 1
          fi
          dir="$RUNNER_TEMP/checks-tooling"
          mkdir -p "$dir"
          for f in .github/requirements-ci.txt .pre-commit-config.yaml; do
            curl --fail --silent --show-error --location --proto '=https' --retry 3 \
              -o "$dir/$(basename "$f")" \
              "https://raw.githubusercontent.com/$WORKFLOW_REPOSITORY/$WORKFLOW_SHA/$f"
          done
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "hash=$(cat "$dir/.pre-commit-config.yaml" .pre-commit-config.yaml | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Go
        if: inputs.go-version-file != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      # pre-commit and its dependencies, each pinned by version and hash, so a
      # changed or added file on PyPI fails the install.
      - name: Install pre-commit
        env:
          TOOLING: ${{ steps.tooling.outputs.dir }}
        run: python -m pip install --disable-pip-version-check --require-hashes -r "$TOOLING/requirements-ci.txt"

      # Through env: and a shell of its own, so the caller's commands are never
      # expanded into this script.
      - name: Setup
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$SETUP"

      # The hook environments, cached by both configs they come from.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.tooling.outputs.hash }}

      # The repository's commit hooks on every file: what a commit runs locally, so
      # skipping them there gains nothing.
      - name: Commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      # The commit hook scans only what is staged, so a commit made with --no-verify,
      # outside Claude Code or on the web would pass it: scan every commit in the PR.
      # HEAD is the PR's merge commit, so HEAD^1..HEAD is the PR's commits.
      - name: No secrets in the PR's commits
        if: github.event_name == 'pull_request'
        env:
          TOOLING: ${{ steps.tooling.outputs.dir }}
        run: pre-commit run gitleaks-pr --hook-stage manual --config "$TOOLING/.pre-commit-config.yaml"
