name: Go

# The language checks every Go repository runs on a PR: gofmt, `go mod tidy`, go
# vet, golangci-lint, the tests with the race detector, skipped tests failing and a
# coverage floor, go build, govulncheck, and the Go test guard. The language-neutral
# checks come from checks.yml, called beside this one.
#
# Call it from a job of its own, pinned by the release tag's commit SHA, and pass the
# test guard's finding to checks.yml, which asks the PR for a `Tests weakened:` line:
#
#   jobs:
#     go:
#       permissions:
#         contents: read
#       uses: those-who-run/.github/.github/workflows/go.yml@<sha> # vX.Y.Z
#       with:
#         coverage-floor: 90
#     checks:
#       needs: go
#       if: ${{ !cancelled() }}
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: those-who-run/.github/.github/workflows/checks.yml@<sha> # vX.Y.Z
#       with:
#         tests-weakened: ${{ needs.go.outputs.tests-weakened == 'true' }}
#
# Job name: `check`. Rulesets require it by name as `<caller job> / check`, so the
# caller above reports `go / check`, beside checks.yml's `checks / checks`. The name
# stays: renaming it leaves every caller's `main` waiting for a check that never
# reports.
#
# The module pins its tools in tools/go.mod (checksummed in tools/go.sum), apart from
# its own go.mod, and both this workflow and `make check` run them with
# `go tool -modfile=tools/go.mod golangci-lint|govulncheck`. golangci-lint reads the
# module's own config (.golangci.yml).
#
# The checks themselves are scripts/go_check.py and scripts/go_test_guard.py in this
# repository, fetched at the commit the caller pinned, never from the PR being
# checked, so a PR can't edit the guard that judges it. The guard runs before any of
# the PR's code.
#
# Changing an input (adding a required one, removing or renaming one, or changing
# a default's meaning) is a breaking change: see AGENTS.md.
on:
  workflow_call:
    inputs:
      coverage-floor:
        description: >-
          The lowest total statement coverage the tests may reach, in per cent. A
          package without tests counts as uncovered.
        type: number
        default: 90
      working-directory:
        description: The module's directory (the one with go.mod), from the repository root.
        type: string
        default: "."
      cgo:
        description: >-
          Whether vet, lint and build run with cgo. The tests always do: the race
          detector needs it.
        type: boolean
        default: false
    outputs:
      tests-weakened:
        description: >-
          'true' when the test guard found the PR weakening a test, else 'false'
          (always 'false' off a pull request). checks.yml takes it as its
          `tests-weakened` input.
        value: ${{ jobs.check.outputs.tests-weakened }}

# Nothing by default; the job asks for what it uses.
permissions: {}

# Actions are pinned by commit SHA (the tag in the comment); Dependabot bumps them.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tests-weakened: ${{ steps.guard.outputs.weakened || 'false' }}
    env:
      CGO_ENABLED: ${{ inputs.cgo && '1' || '0' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # This workflow's scripts at the commit the caller pinned. The job context names
      # that commit (job.workflow_repository, job.workflow_sha); it comes in whole
      # through toJSON because actionlint v1.7.12 does not know those two properties
      # yet. They go to the runner's temporary directory, outside the checkout, so
      # nothing in the PR can stand in for them.
      - name: Fetch the checks
        working-directory: ${{ runner.temp }}
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          WORKFLOW_REPOSITORY=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          WORKFLOW_SHA=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if ! [[ $WORKFLOW_REPOSITORY =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && $WORKFLOW_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The job context does not name this workflow's repository and commit."
            exit 1
          fi
          mkdir -p go-checks
          for f in go_check.py go_test_guard.py; do
            curl --fail --silent --show-error --location --proto '=https' --retry 3 \
              -o "go-checks/$f" \
              "https://raw.githubusercontent.com/$WORKFLOW_REPOSITORY/$WORKFLOW_SHA/scripts/$f"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the test guard diffs the PR against its base

      # Before any of the PR's code runs, so nothing it does can change the finding.
      # It reports and sets the output; checks.yml asks for the reason.
      - name: Test guard
        id: guard
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 "$RUNNER_TEMP/go-checks/go_test_guard.py" "$BASE" "$HEAD"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        if: ${{ !cancelled() }}
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/**/go.sum

      # Each check runs whatever the one before found, so one run shows every failure.
      - name: gofmt
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/go-checks/go_check.py" fmt
      - name: go mod tidy
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/go-checks/go_check.py" tidy
      - name: go vet
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/go-checks/go_check.py" vet
      - name: golangci-lint
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/go-checks/go_check.py" lint
      - name: Tests (race detector, no skips, coverage floor)
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        env:
          FLOOR: ${{ inputs.coverage-floor }}
        run: python3 "$RUNNER_TEMP/go-checks/go_check.py" test --floor "$FLOOR"
      - name: go build
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/go-checks/go_check.py" build
      - name: govulncheck
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/go-checks/go_check.py" vuln
