name: Python

# The language checks every Python repository runs on a PR: uv.lock up to date with
# pyproject.toml, the project installed from it, ruff's formatter and linter, mypy,
# and pytest under coverage, with skipped tests failing and a coverage floor. The
# language-neutral checks come from checks.yml, called beside this one as a separate
# required check. README.md in this directory has the inputs, the job name and a
# caller.
#
# Job name: `check`. Rulesets require it by name as `<caller job> / check`, so a
# caller job named `python` reports `python / check`, beside checks.yml's
# `checks / checks`. The name stays: renaming it leaves every caller's `main` waiting
# for a check that never reports.
#
# The project pins its tools (ruff, mypy, pytest, coverage) in its own uv.lock, in a
# dependency group uv installs by default, and its Python in .python-version; both
# this workflow and `make check` run those. uv itself is the newest release that the
# project's `[tool.uv] required-version` allows, the newest of all without one.
#
# The checks themselves are scripts/python_check.py in this repository, checked out
# at the commit the caller pinned, never from the PR being checked, so a PR can't
# edit the checks that judge it.
#
# Nothing here reads the pull request, so on `merge_group` (a caller that triggers on
# it, for a merge queue) every check runs on the merge group's commit
# (tests/test_merge_group.py).
#
# Changing an input (adding a required one, removing or renaming one, or changing
# a default's meaning) is a breaking change: see AGENTS.md.
on:
  workflow_call:
    inputs:
      coverage-floor:
        description: >-
          The lowest total coverage the tests may reach, in per cent, as coverage
          reports it for what the project's `[tool.coverage.run]` measures.
        type: number
        default: 90
      working-directory:
        description: The project's directory (the one with pyproject.toml and uv.lock), from the repository root.
        type: string
        default: "."

# Nothing by default; the job asks for what it uses.
permissions: {}

# Actions are pinned by commit SHA (the tag in the comment); Renovate bumps them.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # This workflow's own commit, which the caller pinned. The job context names it
      # (job.workflow_repository, job.workflow_sha); it comes in whole through toJSON
      # because actionlint v1.7.12 does not know those two properties yet.
      - name: Find this workflow's commit
        id: workflow
        working-directory: ${{ runner.temp }}
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          repository=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if ! [[ $repository =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The job context does not name this workflow's repository and commit."
            exit 1
          fi
          {
            echo "repository=$repository"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      # The checks' script at that commit. checkout places a repository only inside
      # the workspace, so it goes there first and then to the runner's temporary
      # directory, outside the caller's checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.workflow.outputs.repository }}
          ref: ${{ steps.workflow.outputs.sha }}
          path: .python-checks
          sparse-checkout: scripts
          persist-credentials: false

      # git checked the file out by object ID from the pinned commit, and HEAD must be
      # that commit, so the script is the one the caller pinned. Its SHA-256 digest,
      # taken here, is checked again before each step that runs it.
      - name: Set the checks apart
        id: checks
        working-directory: ${{ runner.temp }}
        env:
          WORKFLOW_SHA: ${{ steps.workflow.outputs.sha }}
        run: |
          src="$GITHUB_WORKSPACE/.python-checks"
          if [ "$(git -C "$src" rev-parse HEAD)" != "$WORKFLOW_SHA" ]; then
            echo "::error::The checks were not checked out at $WORKFLOW_SHA."
            exit 1
          fi
          f=python_check.py
          if [ "$(git -C "$src" hash-object "scripts/$f")" != "$(git -C "$src" rev-parse "HEAD:scripts/$f")" ]; then
            echo "::error::scripts/$f does not match $WORKFLOW_SHA."
            exit 1
          fi
          mkdir python-checks
          mv "$src/scripts/$f" python-checks/
          rm -rf "$src"
          {
            echo "sha256<<SHA256_END"
            sha256sum "$RUNNER_TEMP"/python-checks/*.py
            echo "SHA256_END"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv, which installs the project's Python (.python-version) as the checks need it.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        id: uv
        if: ${{ !cancelled() && steps.checks.outcome == 'success' }}
        with:
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-glob: uv.lock

      # Each check runs whatever the one before found, so one run shows every failure.
      # The environment comes from uv.lock as it stands, so a stale lock fails its own
      # check and no other.
      - name: uv.lock is up to date
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        env:
          CHECKS_SHA256: ${{ steps.checks.outputs.sha256 }}
        run: |
          sha256sum --quiet --strict --check <<<"$CHECKS_SHA256"
          python3 "$RUNNER_TEMP/python-checks/python_check.py" lock
      - name: Install from uv.lock
        id: sync
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        env:
          CHECKS_SHA256: ${{ steps.checks.outputs.sha256 }}
        run: |
          sha256sum --quiet --strict --check <<<"$CHECKS_SHA256"
          python3 "$RUNNER_TEMP/python-checks/python_check.py" sync
      - name: ruff format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          CHECKS_SHA256: ${{ steps.checks.outputs.sha256 }}
        run: |
          sha256sum --quiet --strict --check <<<"$CHECKS_SHA256"
          python3 "$RUNNER_TEMP/python-checks/python_check.py" format
      - name: ruff check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          CHECKS_SHA256: ${{ steps.checks.outputs.sha256 }}
        run: |
          sha256sum --quiet --strict --check <<<"$CHECKS_SHA256"
          python3 "$RUNNER_TEMP/python-checks/python_check.py" lint
      - name: mypy
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          CHECKS_SHA256: ${{ steps.checks.outputs.sha256 }}
        run: |
          sha256sum --quiet --strict --check <<<"$CHECKS_SHA256"
          python3 "$RUNNER_TEMP/python-checks/python_check.py" types
      - name: Tests (no skips, coverage floor)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          CHECKS_SHA256: ${{ steps.checks.outputs.sha256 }}
          FLOOR: ${{ inputs.coverage-floor }}
        run: |
          sha256sum --quiet --strict --check <<<"$CHECKS_SHA256"
          python3 "$RUNNER_TEMP/python-checks/python_check.py" test --floor "$FLOOR"
