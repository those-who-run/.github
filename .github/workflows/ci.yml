name: CI

# The one required check on this repository is the `test` job, by that name
# (scripts/protect-repo.sh --checks "test"). Renaming it leaves `main` waiting for a
# check that never reports.
on:
  pull_request:
  push:
    branches: [main]
  # release-please's PR is made with the GITHUB_TOKEN, which starts no workflows;
  # release-please.yml dispatches this on the release branch instead, so the PR's
  # required check reports.
  workflow_dispatch:

# Nothing by default; the job asks for what it uses.
permissions: {}

# A new push to a PR cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag in the comment); Dependabot bumps them.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the PR's commits
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      # The guard and its settings (agent/), which every repository copies.
      - name: Guard tests
        run: python -m unittest discover agent/tests
      # The commit hooks on every file: what a commit runs locally, so skipping them
      # there gains nothing. Their environments are cached by the config they come
      # from.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
      # A hook that passes everything looks the same as one that finds nothing, so
      # show zizmor a workflow with an action pinned by tag and expect it to refuse.
      - name: zizmor refuses an unpinned action
        run: |
          case_file=.github/workflows/zz-unpinned-case.yml
          cp tests/fixtures/unpinned-action.yml "$case_file"
          if pre-commit run zizmor --files "$case_file"; then
            echo "::error file=tests/fixtures/unpinned-action.yml::zizmor passed a workflow with an unpinned action"
            exit 1
          fi
          rm "$case_file"
      # The commit hook scans only what is staged, so a commit made with --no-verify,
      # outside Claude Code or on the web would pass it: scan every commit in the PR.
      # HEAD is the PR's merge commit, so HEAD^1..HEAD is the PR's commits.
      - name: No secrets in the PR's commits
        if: github.event_name == 'pull_request'
        run: pre-commit run gitleaks-pr --hook-stage manual
      # A squash merge takes the PR title as the commit subject, which no local hook
      # sees: the same commit-msg hook checks it. The title comes in through env:,
      # never expanded into the script.
      - name: PR title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          pre-commit run conventional-pre-commit --hook-stage commit-msg \
            --commit-msg-filename "$RUNNER_TEMP/pr-title"
