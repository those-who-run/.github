name: CI

# Two jobs are required by name: `test`, this repository's own tests, and
# `checks / checks`, the language-neutral checks every repository runs, from
# checks.yml in this repository. Renaming either leaves `main` waiting for a check
# that never reports. The other two, `go-fixture` and `go-check-cases`, test go.yml.
# release-please's PR is opened by the organisation's release App, so it starts this
# through `pull_request` like any other PR.
on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job asks for what it uses.
permissions: {}

# A new push to a PR cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag in the comment); Renovate bumps them.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      # pre-commit and its dependencies, each pinned by version and hash.
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-ci.txt
      # The guard and its settings (agent/), which every repository copies.
      - name: Guard tests
        run: python -m unittest discover agent/tests
      # This repository's own checks: every external hook pinned to a commit SHA with
      # a `frozen:` comment, checks.yml's job name and permissions, the workflows'
      # own shapes and the Renovate preset's decided values (default.json; the
      # `checks` job's commit hooks validate it with renovate-config-validator).
      # The `hook-pins` commit hook runs the same tests locally.
      - name: Repository tests
        run: python -m unittest discover tests
      # The commit hooks' environments, which the zizmor check below installs,
      # cached by the config they come from.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # A hook that passes everything looks the same as one that finds nothing, so
      # show zizmor a workflow with an action pinned by tag and expect it to refuse it
      # with the unpinned-uses audit, not just to fail for some other reason.
      - name: zizmor refuses an unpinned action
        run: |
          case_file=.github/workflows/zz-unpinned-case.yml
          cp tests/fixtures/unpinned-action.yml "$case_file"
          if pre-commit run zizmor --files "$case_file" > "$RUNNER_TEMP/zizmor.out" 2>&1; then
            cat "$RUNNER_TEMP/zizmor.out"
            echo "::error file=tests/fixtures/unpinned-action.yml::zizmor passed a workflow with an unpinned action"
            exit 1
          fi
          cat "$RUNNER_TEMP/zizmor.out"
          if ! grep -q 'unpinned-uses' "$RUNNER_TEMP/zizmor.out"; then
            echo "::error file=tests/fixtures/unpinned-action.yml::zizmor failed, but without the unpinned-uses finding"
            exit 1
          fi
          rm "$case_file"

  # The checks every repository runs: the commit hooks on every file, gitleaks over
  # the PR's commits, the PR title and dependency review. Called from this checkout,
  # so a PR that changes checks.yml is checked by it. It reads the repository only
  # (checkout and the dependency graph); the PR title comes from the event.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  # go.yml (#15) on a small module that passes it, so the reusable workflow is run
  # where it lives. Not a required check here: this repository has no Go of its own.
  go-fixture:
    permissions:
      contents: read
      pull-requests: read # go.yml's reason check reads the PR's description
    uses: ./.github/workflows/go.yml
    with:
      working-directory: tests/go/fixture

  # The same module broken one way at a time: each of go.yml's checks fails for its
  # own reason (tests/go/test_go_check.py).
  go-check-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go/fixture/go.mod
          cache-dependency-path: tests/go/fixture/**/go.sum
      - name: go.yml's checks fail on a broken module
        run: python3 -m unittest discover -s tests/go -v
