name: release-please

# The release PR, for any repository that calls this on every push to its default
# branch. Merged PRs collect in one release PR, `chore(release): x.y.z`, that
# release-please keeps up to date: the next version and the changelog, from the
# caller's release-please-config.json and .release-please-manifest.json (one package,
# at the root). The maintainer merges it by hand, and that merge is the decision to
# release: the run on the merge tags it vX.Y.Z, creates the GitHub release, and sets
# the outputs, then dispatches the caller's release workflow on the new tag, which
# publishes.
#
#   uses: those-who-run/.github/.github/workflows/release-please.yml@<sha> # vX.Y.Z
#
# Inputs: `ci-workflow`, the caller's CI file name, dispatched on the release branch;
# `release-workflow`, the caller's publishing workflow, dispatched on the tag;
# `watched-paths`, more paths for the digest. Outputs: `release_created` (`true`),
# `tag_name` (`v1.2.3`) and `version` (`1.2.3`), all empty on a run that releases
# nothing. Callers, their permissions and the settings: .github/workflows/README.md.
#
# Jobs, by stable name (a caller's checks are `<caller job> / <job>`):
# - release-please: opens or updates the release PR, or releases a merged one.
# - digest: comments on the release PR what changed since the last release in the
#   places that need a human look (scripts/release_digest.py from this repository).
# - release-pr: dispatches the caller's CI on the release branch.
# - auto-merge-off: turns off auto-merge on the release PR if anyone armed it.
# - release: on a release, dispatches the caller's release workflow on the new tag.
#   A dispatch, not a call: a called workflow runs on the caller's ref (main), where
#   a tag check and a `release` environment limited to v* tags would refuse it; the
#   dispatched run is on the tag itself. A dispatch is also the one event the
#   GITHUB_TOKEN may start, so no other token is needed.
#
# Tokens: only the GITHUB_TOKEN. For it to open the release PR, the calling
# repository needs "Allow GitHub Actions to create and approve pull requests", which
# also lets a workflow's token approve a PR: so turn it on only with code-owner review
# required on `main` (scripts/protect-repo.sh --code-owners --actions-prs).
#
# Who merges: the maintainer, by hand. Nothing here merges or arms auto-merge, and
# auto-merge-off disarms it: an auto-merge armed on the release PR merges it as the
# GITHUB_TOKEN, whose push starts no workflow, so the release is never tagged (v1's
# 0.7.6, those-who-run/those-who-run#394).
on:
  workflow_call:
    inputs:
      ci-workflow:
        description: The caller's CI workflow file name, run on the release PR's branch.
        type: string
        default: ci.yml
      release-workflow:
        description: The caller's release workflow file name, dispatched on the new tag; empty for none.
        type: string
        default: release.yml
      watched-paths:
        description: More paths for the digest to list, space-separated; a directory ends in /.
        type: string
        default: ""
    outputs:
      release_created:
        description: "`true` when this run released; empty otherwise."
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: The release's tag (v1.2.3); empty when nothing was released.
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: The release's version (1.2.3); empty when nothing was released.
        value: ${{ jobs.release-please.outputs.version }}

# Nothing by default; each job asks for what it uses.
permissions: {}

# Actions are pinned by commit SHA (the tag in the comment); Dependabot bumps them.
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release PR's branch, the v* tag and the GitHub release
      # The release PR and its autorelease labels. No issues: write: the label
      # endpoints take either "Issues" or "Pull requests" write (GitHub's REST docs,
      # "Add labels to an issue" and "Create a label").
      pull-requests: write
    # Gated on release_created, so a run that releases nothing leaves all three empty
    # whatever the action reports.
    outputs:
      release_created: ${{ steps.rp.outputs.release_created == 'true' && 'true' || '' }}
      tag_name: ${{ steps.rp.outputs.release_created == 'true' && steps.rp.outputs.tag_name || '' }}
      version: ${{ steps.rp.outputs.release_created == 'true' && steps.rp.outputs.version || '' }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One comment on the release PR, edited in place on every push, not only when
  # release-please changed the PR: a ci: or chore: commit ships in the release
  # without touching its changelog. It reads git history and runs nothing from it.
  digest:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the comment on the release PR
    steps:
      - name: Find the release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "autorelease: pending" --json number --jq '.[0].number // empty')
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            echo "No open release PR." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.pr.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
          fetch-depth: 0 # the history and tags since the last release
      # The script from this repository at the commit the caller pinned, so every
      # repository runs the same digest and none keeps a copy. With either property
      # empty, checkout would fall back to the caller's repository at its default
      # branch without a word, so the job stops first.
      - name: The commit this workflow runs from
        if: steps.pr.outputs.number != ''
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the digest script can't be checked out at the pinned commit"
            exit 1
          fi
      - if: steps.pr.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools
          persist-credentials: false
          sparse-checkout: scripts/release_digest.py
          sparse-checkout-cone-mode: false
      - name: Work out the digest
        if: steps.pr.outputs.number != ''
        working-directory: repo
        env:
          WATCHED: ${{ inputs.watched-paths }}
        run: |
          watch=()
          for path in $WATCHED; do
            watch+=(--watch "$path")
          done
          python3 ../tools/scripts/release_digest.py "${watch[@]}" > "$RUNNER_TEMP/digest.md"
          cat "$RUNNER_TEMP/digest.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the digest on the release PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # Ours: by this token's bot, starting with release_digest.py's MARKER.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]"
              and (.body | startswith("<!-- release-digest -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F "body=@$RUNNER_TEMP/digest.md" > /dev/null
            echo "Updated the digest on #$PR." >> "$GITHUB_STEP_SUMMARY"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F "body=@$RUNNER_TEMP/digest.md" > /dev/null
            echo "Commented the digest on #$PR." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The release PR is made with the GITHUB_TOKEN, so no CI starts on it and its
  # required checks would never report. A dispatch is the one event that token may
  # start: run the caller's CI on the release branch whenever release-please changed
  # it.
  release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatches CI on the release branch
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.release-please.outputs.pr }}
      CI_WORKFLOW: ${{ inputs.ci-workflow }}
    steps:
      - name: CI on the release branch
        run: |
          case "$CI_WORKFLOW" in
            *[!A-Za-z0-9._-]* | "") echo "::error::ci-workflow is a file name: $CI_WORKFLOW"; exit 1 ;;
          esac
          branch=$(jq -r '.headBranchName' <<<"$PR")
          gh workflow run "$CI_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo "Dispatched $CI_WORKFLOW on $branch." >> "$GITHUB_STEP_SUMMARY"

  # Auto-merge kept off on every run, not only when release-please touched the PR:
  # auto-merge armed after the PR's last update would otherwise stay armed. The
  # GraphQL mutation only disarms it; nothing here can merge.
  auto-merge-off:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # turns off auto-merge if someone armed it
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Auto-merge off
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "autorelease: pending" --json number,id,autoMergeRequest \
            --jq '.[0] // empty | [.number, .id, (.autoMergeRequest != null)] | @tsv')
          if [ -z "$pr" ]; then
            echo "No open release PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          IFS=$'\t' read -r number id armed <<<"$pr"
          if [ "$armed" = "true" ]; then
            gh api graphql -F id="$id" -f query='
              mutation($id: ID!) {
                disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId }
              }' > /dev/null
            echo "Turned off auto-merge on #$number." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "#$number waits for the maintainer to merge it." >> "$GITHUB_STEP_SUMMARY"

  # The handoff to publishing: the caller's release workflow, run on the tag
  # release-please just made. The workflow must exist at that tag and have
  # `workflow_dispatch:` in its `on:`.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && inputs.release-workflow != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatches the release workflow on the tag
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
    steps:
      - name: Release workflow on the tag
        run: |
          case "$RELEASE_WORKFLOW" in
            *[!A-Za-z0-9._-]*) echo "::error::release-workflow is a file name: $RELEASE_WORKFLOW"; exit 1 ;;
          esac
          if [ -z "$TAG" ]; then
            echo "::error::release-please released, but reported no tag"
            exit 1
          fi
          gh workflow run "$RELEASE_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched $RELEASE_WORKFLOW on $TAG." >> "$GITHUB_STEP_SUMMARY"
